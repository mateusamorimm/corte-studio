<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha — Studio Corte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/complementos.css">
</head>
<body>
  <div class="login-page">
    <main class="login-card">
      <a href="index.html" class="logo">Studio<span>Corte</span></a>
      <h1>Recuperar senha</h1>
      <p class="subtitle">Informe o e-mail da conta. Enviaremos um link para criar uma nova senha.</p>

      <div id="alerta" class="form-alert" hidden></div>

      <form id="recoveryForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail da conta</label>
          <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="seu@email.com">
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Enviar link</button>
      </form>

      <div class="login-footer">
        <a href="login.html">Voltar ao login</a> · <a href="index.html">Voltar ao site</a>
      </div>
    </main>
  </div>

  <script type="module" src="js/pages/recuperar-senha.js"></script>
</body>
</html>
