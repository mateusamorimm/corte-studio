<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs de conta — Studio Corte Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/complementos.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="../index.html" class="logo" style="display:block;margin-bottom:24px">Studio<span>Corte</span></a>
      <nav id="adminNav" aria-label="Menu do painel"></nav>
      <div style="margin-top:auto;padding-top:24px">
        <div class="sidebar-user"></div>
        <button type="button" class="btn btn-ghost btn-sm" data-sair style="width:100%">Sair</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Logs de conta</h1>
          <p class="text-muted">Registro automático de acessos e alterações. Somente leitura.</p>
        </div>
        
      </div>
      <div class="admin-card">
        <form class="admin-filtros" id="filtros">
          <div class="form-group"><label class="form-label" for="lAcao">Ação</label><select class="form-input" id="lAcao" name="acao"><option value="">Todas</option></select></div>
          <div class="form-group" style="flex:1"><label class="form-label" for="lBusca">Usuário</label><input type="search" class="form-input" id="lBusca" name="busca" placeholder="Nome ou e-mail"></div>
        </form>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Data</th><th>Ação</th><th>Usuário</th><th>E-mail</th><th>Detalhe</th></tr></thead>
            <tbody id="logsBody"><tr><td colspan="5" class="estado-vazio">Carregando...</td></tr></tbody>
          </table>
        </div>
        <div style="display:flex;justify-content:center;gap:12px;align-items:center;padding-top:16px">
          <button type="button" class="btn btn-outline btn-sm" id="btnAnterior">← Anterior</button>
          <span class="text-muted" id="paginaInfo"></span>
          <button type="button" class="btn btn-outline btn-sm" id="btnProxima">Próxima →</button>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="../js/admin/logs.js"></script>
</body>
</html>
