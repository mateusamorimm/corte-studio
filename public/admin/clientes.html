<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Studio Corte Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <a href="../index.html" class="logo">Studio<span>Corte</span></a>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">🏠 Dashboard</a>
        <a href="servicos.html" class="sidebar-link">✂️ Serviços</a>
        <a href="clientes.html" class="sidebar-link active">👥 Clientes</a>
        <a href="produtos.html" class="sidebar-link">🛍️ Produtos</a>
        <a href="agendamentos.html" class="sidebar-link">📅 Atendimentos</a>
        <a href="configuracoes.html" class="sidebar-link">⚙️ Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <img class="avatar" src="https://i.pravatar.cc/100?u=admin" alt="Admin">
          <div>
            <div class="name">Carlos Admin</div>
            <div class="role">Proprietário</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()" style="width:100%;">Sair da Conta</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Gerenciamento de Clientes</h1>
          <p class="sub">Cadastre, edite e acompanhe o histórico dos clientes.</p>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
          <div class="search-box">
            <span>🔍</span>
            <input type="text" id="buscaCliente" placeholder="Buscar cliente...">
          </div>
          <button class="btn btn-primary" id="btnNovoCliente">+ Novo Cliente</button>
        </div>
      </div>

      <div class="admin-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Visitas</th>
                <th>Total gasto</th>
                <th>Última visita</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="clientesBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Form novo/editar -->
      <div class="admin-card" id="formCliente" style="display:none;max-width:520px;margin-top:24px;">
        <h3 id="formTitle">Novo Cliente</h3>
        <form id="clienteForm">
          <input type="hidden" id="cliId">
          <div class="form-group">
            <label class="form-label">Nome completo</label>
            <input type="text" class="form-input" id="cliNome" required>
          </div>
          <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-input" id="cliEmail" placeholder="opcional">
          </div>
          <div class="form-group">
            <label class="form-label">Telefone / WhatsApp</label>
            <input type="tel" class="form-input" id="cliTel" required>
          </div>
          <div class="form-group">
            <label class="form-label">Visitas</label>
            <input type="number" class="form-input" id="cliVisitas" value="0" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">Total gasto (R$)</label>
            <input type="number" step="0.01" class="form-input" id="cliGasto" value="0" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">Última visita</label>
            <input type="text" class="form-input" id="cliUltima" placeholder="Ex: 14/09/2026">
          </div>
          <div style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-outline" id="btnCancelar">Cancelar</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
    const user = getUser();
    if (!user || user.role !== "admin") window.location.href = "../login.html";

    const CLIENTES_PADRAO = [
      { id: 1, nome: "Carlos Silva", email: "carlos.silva@email.com", telefone: "(11) 99999-0000", visitas: 24, gasto: 2450, ultima: "02/09/2026", avatar: "https://i.pravatar.cc/40?u=1" },
      { id: 2, nome: "Ana Santos", email: "ana.santos@email.com", telefone: "(11) 98888-1111", visitas: 18, gasto: 1890, ultima: "01/09/2026", avatar: "https://i.pravatar.cc/40?u=2" },
      { id: 3, nome: "Pedro Oliveira", email: "pedro.o@email.com", telefone: "(11) 97777-2222", visitas: 12, gasto: 980, ultima: "28/08/2026", avatar: "https://i.pravatar.cc/40?u=3" },
      { id: 4, nome: "Maria Costa", email: "maria.costa@email.com", telefone: "(11) 96666-3333", visitas: 9, gasto: 1120, ultima: "25/08/2026", avatar: "https://i.pravatar.cc/40?u=4" },
      { id: 5, nome: "Bruno Souza", email: "bruno.s@email.com", telefone: "(11) 95555-4444", visitas: 15, gasto: 1350, ultima: "20/08/2026", avatar: "https://i.pravatar.cc/40?u=5" },
    ];

    let clientes = JSON.parse(localStorage.getItem("sc_clientes")) || [...CLIENTES_PADRAO];

    function saveClientes() {
      localStorage.setItem("sc_clientes", JSON.stringify(clientes));
    }

    function render(filtro = "") {
      const q = filtro.toLowerCase();
      const lista = clientes.filter(c =>
        !q ||
        c.nome.toLowerCase().includes(q) ||
        (c.email || "").toLowerCase().includes(q) ||
        (c.telefone || "").includes(q)
      );

      document.getElementById("clientesBody").innerHTML = lista.map(c => `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px;">
              <img class="avatar" src="${c.avatar || 'https://i.pravatar.cc/40?u=' + c.id}" style="width:32px;height:32px;">
              ${c.nome}
            </div>
          </td>
          <td>${c.email || "—"}</td>
          <td>${c.telefone}</td>
          <td>${c.visitas || 0}</td>
          <td>R$ ${Number(c.gasto || 0).toLocaleString("pt-BR", {minimumFractionDigits: 0})}</td>
          <td>${c.ultima || "—"}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="editar(${c.id})">Editar</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--accent)" onclick="remover(${c.id})">Excluir</button>
          </td>
        </tr>
      `).join("") || `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Nenhum cliente encontrado.</td></tr>`;
    }

    document.getElementById("btnNovoCliente").addEventListener("click", () => {
      document.getElementById("formTitle").textContent = "Novo Cliente";
      document.getElementById("cliId").value = "";
      document.getElementById("clienteForm").reset();
      document.getElementById("cliVisitas").value = "0";
      document.getElementById("cliGasto").value = "0";
      document.getElementById("formCliente").style.display = "block";
      document.getElementById("formCliente").scrollIntoView({ behavior: "smooth" });
    });

    document.getElementById("btnCancelar").addEventListener("click", () => {
      document.getElementById("formCliente").style.display = "none";
    });

    document.getElementById("clienteForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("cliId").value;
      const data = {
        nome: document.getElementById("cliNome").value.trim(),
        email: document.getElementById("cliEmail").value.trim() || null,
        telefone: document.getElementById("cliTel").value.trim(),
        visitas: parseInt(document.getElementById("cliVisitas").value) || 0,
        gasto: parseFloat(document.getElementById("cliGasto").value) || 0,
        ultima: document.getElementById("cliUltima").value.trim() || null,
      };

      if (id) {
        const idx = clientes.findIndex(c => c.id == id);
        if (idx >= 0) {
          clientes[idx] = { ...clientes[idx], ...data };
        }
      } else {
        const newId = clientes.length ? Math.max(...clientes.map(c => c.id)) + 1 : 1;
        clientes.push({
          id: newId,
          ...data,
          avatar: `https://i.pravatar.cc/40?u=${newId}`
        });
      }
      saveClientes();
      render(document.getElementById("buscaCliente").value);
      document.getElementById("formCliente").style.display = "none";
    });

    function editar(id) {
      const c = clientes.find(x => x.id === id);
      if (!c) return;
      document.getElementById("formTitle").textContent = "Editar Cliente";
      document.getElementById("cliId").value = c.id;
      document.getElementById("cliNome").value = c.nome;
      document.getElementById("cliEmail").value = c.email || "";
      document.getElementById("cliTel").value = c.telefone;
      document.getElementById("cliVisitas").value = c.visitas || 0;
      document.getElementById("cliGasto").value = c.gasto || 0;
      document.getElementById("cliUltima").value = c.ultima || "";
      document.getElementById("formCliente").style.display = "block";
      document.getElementById("formCliente").scrollIntoView({ behavior: "smooth" });
    }

    function remover(id) {
      if (!confirm("Excluir este cliente?")) return;
      clientes = clientes.filter(c => c.id !== id);
      saveClientes();
      render(document.getElementById("buscaCliente").value);
    }

    document.getElementById("buscaCliente").addEventListener("input", (e) => {
      render(e.target.value);
    });

    render();
  </script>
</body>
</html>
