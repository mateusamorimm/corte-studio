<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços — Studio Corte Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/complementos.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="../index.html" class="logo" style="display:block;margin-bottom:24px">Studio<span>Corte</span></a>
      <nav id="adminNav" aria-label="Menu do painel"></nav>
      <div style="margin-top:auto;padding-top:24px">
        <div class="sidebar-user"></div>
        <button type="button" class="btn btn-ghost btn-sm" data-sair style="width:100%">Sair</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Serviços</h1>
          <p class="text-muted">Gerencie os serviços oferecidos e seus valores.</p>
        </div>
        <button class="btn btn-primary" id="btnNovoServico">+ Novo Serviço</button>
      </div>
      <div class="admin-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Serviço</th><th>Descrição</th><th>Preço</th><th>Duração</th><th>Ações</th></tr></thead>
            <tbody id="servicosBody">
              <tr><td colspan="5" class="estado-vazio">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Form novo/editar -->
      <dialog class="modal modal-lg" id="formServico"><div class="modal-body">
        <h3 class="modal-title" id="formTitle">Novo Serviço</h3>
        <form id="servicoForm" novalidate>
          <div id="alertaServico" class="form-alert" hidden></div>
          <input type="hidden" id="srvId">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="srvNome">Nome</label>
              <input type="text" class="form-input" id="srvNome" name="nome_servico" maxlength="100" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="srvIcone">Ícone (emoji)</label>
              <input type="text" class="form-input" id="srvIcone" name="icone" maxlength="16" placeholder="✂️">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="srvArea">Área</label>
            <select class="form-input" id="srvArea" name="area"><option value="BARBEARIA">Barbearia</option><option value="CABELEIREIRO">Cabeleireiro</option><option value="AMBOS">Barbearia e cabeleireiro</option></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="srvDesc">Descrição</label>
            <textarea class="form-input" id="srvDesc" name="descricao" rows="2" maxlength="500"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="srvPreco">Preço (R$)</label>
              <input type="number" step="0.01" min="0" class="form-input" id="srvPreco" name="preco" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="srvDuracao">Duração (minutos)</label>
              <input type="number" min="5" max="480" step="5" class="form-input" id="srvDuracao" name="duracao_minutos" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="srvOrdem">Ordem de exibição</label>
              <input type="number" min="0" class="form-input" id="srvOrdem" name="ordem_exibicao" value="0">
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <label class="check-item"><input type="checkbox" name="preco_a_partir_de"> Exibir como "A partir de"</label>
              <label class="check-item"><input type="checkbox" name="ativo" checked> Ativo (aparece no site)</label>
            </div>
          </div>
          <div style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-outline" id="btnCancelar">Cancelar</button>
          </div>
        </form>
      </div></dialog>
    </main>
  </div>
  <script type="module" src="../js/admin/servicos.js"></script>
</body>
</html>
