<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços — Studio Corte Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo">Studio<span>Corte</span></a>
      <nav class="sidebar-nav" aria-label="Menu do painel">
        <a href="index.html" class="sidebar-link" data-so-admin>🏠 Dashboard</a>
        <a href="servicos.html" class="sidebar-link active" data-so-admin>✂️ Serviços</a>
        <a href="clientes.html" class="sidebar-link" data-so-admin>👥 Clientes</a>
        <a href="produtos.html" class="sidebar-link" data-so-admin>🛍️ Produtos</a>
        <a href="pedidos.html" class="sidebar-link" data-so-admin>📦 Pedidos</a>
        <a href="agendamentos.html" class="sidebar-link">📅 Atendimentos</a>
        <a href="equipe.html" class="sidebar-link" data-so-admin>💈 Equipe</a>
        <a href="configuracoes.html" class="sidebar-link" data-so-admin>⚙️ Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar avatar-iniciais" aria-hidden="true"></span>
          <div><div class="name">&nbsp;</div><div class="role">&nbsp;</div></div>
        </div>
        <button class="btn btn-ghost btn-sm" data-sair style="width:100%;">Sair da Conta</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Serviços</h1>
          <p class="sub">Gerencie os serviços oferecidos e seus valores.</p>
        </div>
        <button class="btn btn-primary" id="btnNovoServico">+ Novo Serviço</button>
      </div>
      <div class="admin-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Serviço</th><th>Descrição</th><th>Preço</th><th>Duração</th><th>Ações</th></tr></thead>
            <tbody id="servicosBody">
              <tr><td colspan="5" class="estado-vazio">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Form novo/editar -->
      <div class="admin-card" id="formServico" style="display:none;max-width:560px;margin-top:24px;">
        <h3 id="formTitle">Novo Serviço</h3>
        <form id="servicoForm" novalidate>
          <div id="alertaServico" class="form-alert" hidden></div>
          <input type="hidden" id="srvId">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="srvNome">Nome</label>
              <input type="text" class="form-input" id="srvNome" name="nome_servico" maxlength="100" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="srvIcone">Ícone (emoji)</label>
              <input type="text" class="form-input" id="srvIcone" name="icone" maxlength="16" placeholder="✂️">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="srvDesc">Descrição</label>
            <textarea class="form-input" id="srvDesc" name="descricao" rows="2" maxlength="500"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="srvPreco">Preço (R$)</label>
              <input type="number" step="0.01" min="0" class="form-input" id="srvPreco" name="preco" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="srvDuracao">Duração (minutos)</label>
              <input type="number" min="5" max="480" step="5" class="form-input" id="srvDuracao" name="duracao_minutos" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="srvOrdem">Ordem de exibição</label>
              <input type="number" min="0" class="form-input" id="srvOrdem" name="ordem_exibicao" value="0">
            </div>
            <div class="form-group" style="justify-content:flex-end;">
              <label class="check-item"><input type="checkbox" name="preco_a_partir_de"> Exibir como "A partir de"</label>
              <label class="check-item"><input type="checkbox" name="ativo" checked> Ativo (aparece no site)</label>
            </div>
          </div>
          <div style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-outline" id="btnCancelar">Cancelar</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="../js/admin/servicos.js"></script>
</body>
</html>
