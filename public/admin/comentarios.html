<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentários — Studio Corte Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/complementos.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="../index.html" class="logo" style="display:block;margin-bottom:24px">Studio<span>Corte</span></a>
      <nav id="adminNav" aria-label="Menu do painel"></nav>
      <div style="margin-top:auto;padding-top:24px">
        <div class="sidebar-user"></div>
        <button type="button" class="btn btn-ghost btn-sm" data-sair style="width:100%">Sair</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Comentários</h1>
          <p class="text-muted">Aprove as avaliações dos clientes e modere os comentários do feed.</p>
        </div>
        
      </div>
      <div class="admin-tabs" aria-label="Tipo">
        <button type="button" class="chip active" data-aba="avaliacoes" aria-pressed="true">Avaliações</button>
        <button type="button" class="chip" data-aba="feed" aria-pressed="false">Comentários do feed</button>
      </div>
      <div class="admin-card" id="aba-avaliacoes">
        <form class="admin-filtros" id="filtroAvaliacoes">
          <div class="form-group"><label class="form-label" for="aStatus">Situação</label>
            <select class="form-input" id="aStatus" name="status"><option value="">Todas</option><option value="PENDENTE">Aguardando aprovação</option><option value="APROVADO">Aprovadas</option><option value="REJEITADO">Recusadas</option></select></div>
        </form>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Data</th><th>Cliente</th><th>Sobre</th><th>Notas</th><th>Comentário</th><th>Situação</th><th>Ações</th></tr></thead>
            <tbody id="avaliacoesBody"><tr><td colspan="7" class="estado-vazio">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="admin-card" id="aba-feed" hidden>
        <form class="admin-filtros" id="filtroFeed">
          <div class="form-group"><label class="form-label" for="cFiltro">Situação</label>
            <select class="form-input" id="cFiltro" name="filtro"><option value="">Todos</option><option value="PENDENTE">Aguardando aprovação</option><option value="DENUNCIADO">Denunciados</option><option value="APROVADO">Aprovados</option><option value="REJEITADO">Recusados</option></select></div>
        </form>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Data</th><th>Autor</th><th>Comentário</th><th>Publicação</th><th>Situação</th><th>Ações</th></tr></thead>
            <tbody id="comentariosBody"><tr><td colspan="6" class="estado-vazio">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="../js/admin/comentarios.js"></script>
</body>
</html>
