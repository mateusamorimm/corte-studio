<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Studio Corte Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/complementos.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="../index.html" class="logo" style="display:block;margin-bottom:24px">Studio<span>Corte</span></a>
      <nav id="adminNav" aria-label="Menu do painel"></nav>
      <div style="margin-top:auto;padding-top:24px">
        <div class="sidebar-user"></div>
        <button type="button" class="btn btn-ghost btn-sm" data-sair style="width:100%">Sair</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Gerenciamento de Produtos</h1>
          <p class="text-muted">Adicione, edite e controle o estoque dos produtos do salão.</p>
        </div>
        <button class="btn btn-primary" id="btnNovoProduto">+ Novo Produto</button>
      </div>

      <div class="admin-card" style="margin-bottom:24px;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="produtosBody">
              <tr><td colspan="5" class="estado-vazio">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Form novo/editar -->
      <dialog class="modal " id="formProduto"><div class="modal-body">
        <h3 class="modal-title" id="formTitle">Novo Produto</h3>
        <form id="produtoForm" novalidate>
          <div id="alertaProduto" class="form-alert" hidden></div>
          <input type="hidden" id="prodId">
          <div class="form-group">
            <label class="form-label" for="prodNome">Nome</label>
            <input type="text" class="form-input" id="prodNome" name="nome_produto" maxlength="120" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="prodDesc">Descrição</label>
            <textarea class="form-input" id="prodDesc" name="descricao" rows="2" maxlength="500"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="prodCategoria">Categoria</label>
            <input type="text" class="form-input" id="prodCategoria" name="categoria" maxlength="60" placeholder="Ex.: Barba, Cabelo, Finalização" list="categorias">
            <datalist id="categorias"></datalist>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="prodPreco">Preço (R$)</label>
              <input type="number" step="0.01" min="0" class="form-input" id="prodPreco" name="preco" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="prodEstoque">Estoque</label>
              <input type="number" min="0" step="1" class="form-input" id="prodEstoque" name="quantidade_estoque" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="prodImg">URL da imagem</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <img class="miniatura" id="prodPrevia" alt="" hidden>
              <input type="url" class="form-input" id="prodImg" name="imagem_url" placeholder="https://..." style="flex:1;">
              <button type="button" class="btn btn-outline btn-sm" id="btnEnviarImg">⬆ Enviar</button>
            </div>
            <small class="form-hint">Cole uma URL ou envie um arquivo (JPG, PNG ou WebP; fotos grandes são reduzidas automaticamente).</small>
          </div>
          <div class="form-group">
            <label class="check-item"><input type="checkbox" name="ativo" checked> Ativo (à venda no site)</label>
          </div>
          <div style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-outline" id="btnCancelar">Cancelar</button>
          </div>
        </form>
      </div></dialog>
    </main>
  </div>

  <script type="module" src="../js/admin/produtos.js"></script>
</body>
</html>
