<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Studio Corte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/complementos.css">
</head>
<body>
  <div class="login-page">
    <main class="login-card">
      <a href="index.html" class="logo">Studio<span>Corte</span></a>
      <h1>Entrar na conta</h1>
      <p class="subtitle">Use seu e-mail e a senha para acessar o perfil.</p>

      <div id="alerta" class="form-alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail ou usuário</label>
          <input class="form-input" type="text" id="email" name="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="seu@email.com ou usuário">
        </div>
        <div class="form-group">
          <label class="form-label" for="senha">Senha</label>
          <div class="input-with-icon">
            <input class="form-input" type="password" id="senha" name="senha" required autocomplete="current-password" placeholder="••••••••">
            <button type="button" class="toggle-senha" data-toggle-senha="senha" aria-label="Mostrar senha" aria-pressed="false">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
      </form>

      <div class="login-footer">
        <a href="recuperar-senha.html">Esqueci a senha</a> · <a href="index.html">Voltar ao site</a><br>
        Ainda não tem conta? <a href="cadastro.html" id="linkCadastro">Criar conta</a>
      </div>
    </main>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
