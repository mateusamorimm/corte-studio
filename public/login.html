<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Studio Corte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-visual">
      <div class="login-visual-content">
        <span class="tag">ESTILO & ATITUDE</span>
        <h2>Seu próximo corte, pensado antes de sentar na cadeira.</h2>
        <p>Agende com facilidade, acompanhe seus serviços favoritos e garanta o visual perfeito com os melhores profissionais.</p>
      </div>
    </div>

    <main class="login-form-side">
      <div class="login-box">
        <a href="index.html" class="logo">Studio<span>Corte</span></a>
        <p class="tagline">Cortes com precisão • Agende com confiança</p>

        <div id="alerta" class="form-alert" hidden></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <div class="input-with-icon">
              <span class="icon" aria-hidden="true">👤</span>
              <input type="email" class="form-input" id="email" name="email" placeholder="seu.email@exemplo.com" autocomplete="email" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="senha">Senha</label>
            <div class="input-with-icon">
              <span class="icon" aria-hidden="true">🔒</span>
              <input type="password" class="form-input" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
              <button type="button" class="toggle-senha" data-toggle-senha="senha" aria-label="Mostrar senha" aria-pressed="false">👁️</button>
            </div>
          </div>

          <div class="form-actions">
            <a href="recuperar-senha.html">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Entrar na Conta</button>
        </form>

        <p class="login-footer">
          Não tem conta? <a href="cadastro.html" id="linkCadastro">Criar conta</a>
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
